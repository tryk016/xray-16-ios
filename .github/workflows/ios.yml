name: iOS

# iOS builds must run on macOS (the iPhoneOS SDK, clang sysroot and codesign are
# macOS-only). Changes are authored on any OS and compiled here on GitHub's macOS
# runners. This is the ONLY workflow we run on the ios-port branch — the heavy
# desktop matrix (cibuild.yml) and StyleCheck are disabled for this branch.
#
# Output: an unsigned .ipa for the arm64 device build. Unsigned is exactly what
# SideStore / AltStore want — they re-sign on-device with the user's Apple ID.
# The simulator build is kept as a fast iOS compile sanity check (it is an iOS
# build, not the desktop macOS build we dropped) and is what we'll run headless
# in CI from Phase 3 onwards.
#
# Phase 1 scope: a trivial, engine-free target. The full engine is wired in from
# Phase 2 onwards; this file grows with it.

on:
  push:
    branches:
      - ios-port
    paths-ignore:
      # Documentation-only commits don't need to spend CI minutes on a build.
      - 'doc/**'
      - '**/*.md'
  workflow_dispatch:

jobs:
  ios:
    name: iOS ${{ matrix.name }}
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: device (.ipa)
            platform: OS64
            sdk: iphoneos
            package_ipa: true
          - name: simulator (compile check)
            platform: SIMULATORARM64
            sdk: iphonesimulator
            package_ipa: false

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          cmake --version

      - name: Configure (${{ matrix.platform }})
        working-directory: misc/ios/smoketest
        run: >
          cmake -B build -G Xcode
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/cmake/toolchains/ios.toolchain.cmake
          -DPLATFORM=${{ matrix.platform }}
          -DDEPLOYMENT_TARGET=15.0
          -DENABLE_BITCODE=OFF
          --log-level=VERBOSE

      - name: Build
        working-directory: misc/ios/smoketest
        run: cmake --build build --config Release

      - name: Inspect binary
        working-directory: misc/ios/smoketest
        run: |
          set -e
          APP=$(find build -maxdepth 4 -name 'ios_smoketest.app' | head -1)
          if [ -z "$APP" ]; then echo "::error::app bundle not found"; exit 1; fi
          BIN="$APP/ios_smoketest"
          file "$BIN"
          lipo -info "$BIN"
          vtool -show-build "$BIN" 2>/dev/null || true

      - name: Package unsigned .ipa
        if: ${{ matrix.package_ipa }}
        working-directory: misc/ios/smoketest
        run: |
          set -e
          APP=$(find build -maxdepth 4 -name 'ios_smoketest.app' | head -1)
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          # An .ipa is just a zip of a Payload/<App>.app tree.
          zip -qr OpenXRay-smoketest-unsigned.ipa Payload
          echo "--- .ipa contents ---"
          unzip -l OpenXRay-smoketest-unsigned.ipa

      - name: Upload .ipa
        if: ${{ matrix.package_ipa }}
        uses: actions/upload-artifact@v4
        with:
          name: OpenXRay-ios-smoketest-ipa
          path: misc/ios/smoketest/OpenXRay-smoketest-unsigned.ipa
          if-no-files-found: error

  # Phase 2: cross-build the engine's C dependencies from source for each iOS SDK.
  # Slice 2a wires up the superbuild and its keystone dependency, SDL2. Later slices
  # (ogg/vorbis/theora/lzo, OpenAL, LuaJIT) extend cmake/ios/deps/CMakeLists.txt.
  deps:
    name: iOS deps ${{ matrix.name }}
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: device
            platform: OS64
            sdk: iphoneos
          - name: simulator
            platform: SIMULATORARM64
            sdk: iphonesimulator

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          cmake --version

      - name: Cross-build dependency superbuild (${{ matrix.platform }})
        run: |
          set -e
          PREFIX="$PWD/build/ios-prefix-${{ matrix.sdk }}"
          cmake -S cmake/ios/deps -B "build/ios-deps-${{ matrix.sdk }}" \
            -DIOS_TOOLCHAIN_FILE="$PWD/cmake/toolchains/ios.toolchain.cmake" \
            -DPLATFORM=${{ matrix.platform }} \
            -DDEPLOYMENT_TARGET=15.0 \
            -DENABLE_BITCODE=OFF \
            -DCMAKE_INSTALL_PREFIX="$PREFIX"
          cmake --build "build/ios-deps-${{ matrix.sdk }}" --parallel 4

      - name: Verify static libs are arm64
        run: |
          set -e
          PREFIX="$PWD/build/ios-prefix-${{ matrix.sdk }}"
          echo "--- installed lib/ ---"
          ls -la "$PREFIX/lib" || true
          # Every dependency the engine links must be present and built for arm64.
          for lib in libSDL2.a libopenal.a libogg.a libvorbis.a libvorbisfile.a libtheora.a liblzo2.a; do
            path=$(find "$PREFIX" -name "$lib" | head -1)
            if [ -z "$path" ]; then echo "::error::$lib not found in prefix"; exit 1; fi
            info=$(lipo -info "$path")
            echo "$info"
            echo "$info" | grep -qi 'arm64' || { echo "::error::$lib is not arm64"; exit 1; }
          done
          echo "all dependency static libs present and arm64"

      - name: Upload deps prefix
        uses: actions/upload-artifact@v4
        with:
          name: ios-deps-${{ matrix.sdk }}
          path: build/ios-prefix-${{ matrix.sdk }}
          if-no-files-found: error

  # Phase 2d: configure the WHOLE engine for iOS against the pre-built deps prefix and
  # compile it in growing slices (no final xr_3da link yet — that's Phase 2e). Reuses the
  # already-green deps artifact via `needs: deps` instead of rebuilding it.
  #   Slice 1: configure + generate only (static, LuaJIT interpreter mode).  [green]
  #   Slice 3: also compile the Externals static libs.
  #   Slice 4: also compile the engine static libs.
  engine-build:
    name: iOS engine ${{ matrix.name }}
    runs-on: macos-latest
    timeout-minutes: 55
    needs: deps
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: device
            platform: OS64
            sdk: iphoneos
          - name: simulator
            platform: SIMULATORARM64
            sdk: iphonesimulator

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          cmake --version

      - name: Download deps prefix
        uses: actions/download-artifact@v4
        with:
          name: ios-deps-${{ matrix.sdk }}
          path: build/ios-prefix-${{ matrix.sdk }}

      - name: Configure engine (${{ matrix.platform }})
        run: >
          cmake -S . -B build/ios-engine-${{ matrix.sdk }} -G Xcode
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/cmake/toolchains/ios.toolchain.cmake
          -DPLATFORM=${{ matrix.platform }}
          -DDEPLOYMENT_TARGET=15.0
          -DENABLE_BITCODE=OFF
          -DBUILD_SHARED_LIBS=OFF
          -DLUAJIT_DISABLE_JIT=ON
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/build/ios-prefix-${{ matrix.sdk }}
          -DCMAKE_FIND_ROOT_PATH=${{ github.workspace }}/build/ios-prefix-${{ matrix.sdk }}
          --log-level=VERBOSE

      - name: Verify configure results
        run: |
          set -e
          DIR=build/ios-engine-${{ matrix.sdk }}
          # The Xcode project must have been generated.
          if [ ! -e "$DIR/OpenXRay.xcodeproj/project.pbxproj" ]; then
            echo "::error::engine Xcode project was not generated"; exit 1
          fi
          # The iOS branch must have taken effect: static build, standard allocator.
          grep -q 'BUILD_SHARED_LIBS:BOOL=OFF' "$DIR/CMakeCache.txt" \
            || { echo "::error::BUILD_SHARED_LIBS is not OFF"; exit 1; }
          grep -q 'MEMORY_ALLOCATOR:STRING=standard' "$DIR/CMakeCache.txt" \
            || echo "::warning::MEMORY_ALLOCATOR is not 'standard'"
          echo "engine configured for iOS (static, deps resolved)"

      # Slice 3: compile the Externals static libraries. This is the first real iOS
      # compile of LuaJIT under the Xcode generator (its build-time host codegen tools
      # + VM generation), luabind, xrLuaFix, OPCODE, ODE, and ImGui (ES3 backend).
      - name: Build Externals static libs (${{ matrix.platform }})
        run: >
          cmake --build build/ios-engine-${{ matrix.sdk }} --config Release
          --target xrLuaJIT xrLuabind xrLuaFix xrOPCODE xrODE xrImGui
          -- -quiet

      - name: Verify Externals libs are arm64
        run: |
          set -e
          # Output names vary by each target's PREFIX property (libX.a vs X.a) and land
          # under the build tree or bin/; match a *<stem>.a glob from the repo root.
          for stem in xrLuaJIT xrLuabind xrLuaFix xrOPCODE xrODE xrImGui; do
            path=$(find . -name "*${stem}.a" 2>/dev/null | head -1)
            if [ -z "$path" ]; then echo "::error::${stem} static lib not found"; find . -name '*.a' 2>/dev/null; exit 1; fi
            info=$(lipo -info "$path"); echo "$info"
            echo "$info" | grep -qi 'arm64' || { echo "::error::${stem} is not arm64"; exit 1; }
          done
          echo "all Externals static libs present and arm64"

      # Slice 4a: compile the engine support libs (everything except the big three:
      # xrEngine, xrRender_GL, xrGame — those are Slice 4b). Build each target on its own,
      # continuing past failures, so one CI round surfaces every broken module. No link.
      - name: Build engine support libs (${{ matrix.platform }})
        run: |
          DIR=build/ios-engine-${{ matrix.sdk }}
          targets="xrMiscMath xrCore xrAICore xrCDB xrAPI xrUICore xrMaterialSystem xrParticles xrNetServer xrPhysics xrSound xrScriptEngine"
          failed=""
          for t in $targets; do
            echo "::group::build $t"
            if cmake --build "$DIR" --config Release --target "$t" -- -quiet; then
              echo "OK: $t"
            else
              echo "::error::build failed: $t"; failed="$failed $t"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error::failed engine libs:$failed"; exit 1; fi
          echo "all Slice 4a engine support libs compiled for iOS"

      # Slice 4b: compile the big three. xrRender_GL uses desktop GL via glad (compiles as
      # in-lib function pointers; runtime GLES port is Phase 4). xrGame is huge and the
      # likeliest to surface source-level GameSpy/multiplayer references now the lib is gated.
      # No final xr_3da link — that is Phase 2e.
      - name: Build engine core libs (${{ matrix.platform }})
        run: |
          DIR=build/ios-engine-${{ matrix.sdk }}
          failed=""
          for t in xrEngine xrRender_GL xrGame; do
            echo "::group::build $t"
            if cmake --build "$DIR" --config Release --target "$t" -- -quiet; then
              echo "OK: $t"
            else
              echo "::error::build failed: $t"; failed="$failed $t"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error::failed engine libs:$failed"; exit 1; fi
          echo "whole engine compiles for iOS (no xr_3da link — Phase 2e)"

  # Phase 2: LuaJIT is built inside the engine's CMake (not the deps superbuild). This job
  # verifies the iOS cross-compile in isolation: native host codegen tools (minilua/buildvm)
  # generate the VM, and the target xrLuaJIT static lib is built for the iphoneos SDK.
  luajit:
    name: iOS LuaJIT ${{ matrix.name }}
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: device
            platform: OS64
          - name: simulator
            platform: SIMULATORARM64

    steps:
      - uses: actions/checkout@v4

      - name: Init LuaJIT submodule
        run: git submodule update --init Externals/LuaJIT

      - name: Show toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          cmake --version

      - name: Configure (${{ matrix.platform }})
        run: >
          cmake -S cmake/ios/luajit-check -B build/luajit-${{ matrix.platform }}
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/cmake/toolchains/ios.toolchain.cmake
          -DPLATFORM=${{ matrix.platform }}
          -DDEPLOYMENT_TARGET=15.0
          -DENABLE_BITCODE=OFF
          --log-level=VERBOSE

      - name: Build
        run: cmake --build build/luajit-${{ matrix.platform }} --parallel 4

      - name: Verify xrLuaJIT static lib is arm64
        run: |
          set -e
          LIB=$(find build/luajit-${{ matrix.platform }} \( -name 'xrLuaJIT.a' -o -name 'libxrLuaJIT.a' \) | head -1)
          if [ -z "$LIB" ]; then
            echo "::error::xrLuaJIT static lib not found"; find build/luajit-${{ matrix.platform }} -name '*.a'; exit 1
          fi
          echo "lib: $LIB"
          file "$LIB"
          lipo -info "$LIB"
          lipo -info "$LIB" | grep -qi 'arm64' || { echo "::error::xrLuaJIT is not arm64"; exit 1; }
          # The host codegen tools must have run and produced the VM assembly.
          VM=$(find build/luajit-${{ matrix.platform }} -name 'lj_vm.S' | head -1)
          echo "generated VM: ${VM:-<none>}"
