name: iOS

# iOS builds require macOS. Developers build and test locally on macOS; this
# workflow is the clean-room validation path for the ios-port branch.
#
# Output: the complete arm64 application as an unsigned IPA for optional
# SideStore/AltStore distribution. The normal developer loop signs and installs
# locally with misc/ios/install_device.sh. The simulator remains compile
# coverage; physical-device captures are the rendering authority.

on:
  push:
    branches:
      - ios-port
    paths-ignore:
      # Documentation-only commits don't need to spend CI minutes on a build.
      - 'doc/**'
      - '**/*.md'
  workflow_dispatch:

jobs:
  ios:
    name: iOS ${{ matrix.name }}
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: device (.ipa)
            platform: OS64
            sdk: iphoneos
            package_ipa: true
          - name: simulator (compile check)
            platform: SIMULATORARM64
            sdk: iphonesimulator
            package_ipa: false

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          cmake --version

      - name: Configure (${{ matrix.platform }})
        working-directory: misc/ios/smoketest
        run: >
          cmake -B build -G Xcode
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/cmake/toolchains/ios.toolchain.cmake
          -DPLATFORM=${{ matrix.platform }}
          -DDEPLOYMENT_TARGET=16.4
          -DENABLE_BITCODE=OFF
          --log-level=VERBOSE

      - name: Build
        working-directory: misc/ios/smoketest
        run: cmake --build build --config Release

      - name: Inspect binary
        working-directory: misc/ios/smoketest
        run: |
          set -e
          APP=$(find build -maxdepth 4 -name 'ios_smoketest.app' | head -1)
          if [ -z "$APP" ]; then echo "::error::app bundle not found"; exit 1; fi
          BIN="$APP/ios_smoketest"
          file "$BIN"
          lipo -info "$BIN"
          vtool -show-build "$BIN" 2>/dev/null || true

      - name: Package unsigned .ipa
        if: ${{ matrix.package_ipa }}
        working-directory: misc/ios/smoketest
        run: |
          set -e
          APP=$(find build -maxdepth 4 -name 'ios_smoketest.app' | head -1)
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          # An .ipa is just a zip of a Payload/<App>.app tree.
          zip -qr OpenXRay-smoketest-unsigned.ipa Payload
          echo "--- .ipa contents ---"
          unzip -l OpenXRay-smoketest-unsigned.ipa

      - name: Upload .ipa
        if: ${{ matrix.package_ipa }}
        uses: actions/upload-artifact@v4
        with:
          name: OpenXRay-ios-smoketest-ipa
          path: misc/ios/smoketest/OpenXRay-smoketest-unsigned.ipa
          if-no-files-found: error

  # Phase 2: cross-build the engine's C dependencies from source for each iOS SDK.
  # Slice 2a wires up the superbuild and its keystone dependency, SDL2. Later slices
  # (ogg/vorbis/theora/lzo, OpenAL, LuaJIT) extend cmake/ios/deps/CMakeLists.txt.
  deps:
    name: iOS deps ${{ matrix.name }}
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: device
            platform: OS64
            sdk: iphoneos
          - name: simulator
            platform: SIMULATORARM64
            sdk: iphonesimulator

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          cmake --version

      - name: Cross-build dependency superbuild (${{ matrix.platform }})
        run: |
          set -e
          PREFIX="$PWD/build/ios-prefix-${{ matrix.sdk }}"
          cmake -S cmake/ios/deps -B "build/ios-deps-${{ matrix.sdk }}" \
            -DIOS_TOOLCHAIN_FILE="$PWD/cmake/toolchains/ios.toolchain.cmake" \
            -DPLATFORM=${{ matrix.platform }} \
            -DDEPLOYMENT_TARGET=16.4 \
            -DENABLE_BITCODE=OFF \
            -DCMAKE_INSTALL_PREFIX="$PREFIX"
          cmake --build "build/ios-deps-${{ matrix.sdk }}" --parallel 4

      - name: Verify static libs are arm64
        run: |
          set -e
          PREFIX="$PWD/build/ios-prefix-${{ matrix.sdk }}"
          echo "--- installed lib/ ---"
          ls -la "$PREFIX/lib" || true
          # Every dependency the engine links must be present and built for arm64.
          for lib in libSDL2.a libopenal.a libogg.a libvorbis.a libvorbisfile.a libtheora.a liblzo2.a; do
            path=$(find "$PREFIX" -name "$lib" | head -1)
            if [ -z "$path" ]; then echo "::error::$lib not found in prefix"; exit 1; fi
            info=$(lipo -info "$path")
            echo "$info"
            echo "$info" | grep -qi 'arm64' || { echo "::error::$lib is not arm64"; exit 1; }
          done
          echo "all dependency static libs present and arm64"

      - name: Upload deps prefix
        uses: actions/upload-artifact@v4
        with:
          name: ios-deps-${{ matrix.sdk }}
          path: build/ios-prefix-${{ matrix.sdk }}
          if-no-files-found: error

  # Phase 2d: configure the WHOLE engine for iOS against the pre-built deps prefix and
  # compile it in growing slices (no final xr_3da link yet — that's Phase 2e). Reuses the
  # already-green deps artifact via `needs: deps` instead of rebuilding it.
  #   Slice 1: configure + generate only (static, LuaJIT interpreter mode).  [green]
  #   Slice 3: also compile the Externals static libs.
  #   Slice 4: also compile the engine static libs.
  engine-build:
    name: iOS engine ${{ matrix.name }}
    runs-on: macos-latest
    timeout-minutes: 55
    needs: deps
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: device
            platform: OS64
            sdk: iphoneos
            debug_symbols: 'YES'
            debug_format: dwarf-with-dsym
          - name: simulator
            platform: SIMULATORARM64
            sdk: iphonesimulator
            debug_symbols: 'NO'
            debug_format: dwarf

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          cmake --version

      - name: Download deps prefix
        uses: actions/download-artifact@v4
        with:
          name: ios-deps-${{ matrix.sdk }}
          path: build/ios-prefix-${{ matrix.sdk }}

      - name: Configure engine (${{ matrix.platform }})
        run: >
          cmake -S . -B build/ios-engine-${{ matrix.sdk }} -G Xcode
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/cmake/toolchains/ios.toolchain.cmake
          -DPLATFORM=${{ matrix.platform }}
          -DDEPLOYMENT_TARGET=16.4
          -DENABLE_BITCODE=OFF
          -DBUILD_SHARED_LIBS=OFF
          -DLUAJIT_DISABLE_JIT=ON
          -DXR_IOS_BUILD_NUMBER=${{ github.run_number }}
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/build/ios-prefix-${{ matrix.sdk }}
          -DCMAKE_FIND_ROOT_PATH=${{ github.workspace }}/build/ios-prefix-${{ matrix.sdk }}
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO
          -DCMAKE_XCODE_ATTRIBUTE_GCC_GENERATE_DEBUGGING_SYMBOLS=${{ matrix.debug_symbols }}
          -DCMAKE_XCODE_ATTRIBUTE_DEBUG_INFORMATION_FORMAT=${{ matrix.debug_format }}
          --log-level=VERBOSE

      - name: Verify configure results
        run: |
          set -e
          DIR=build/ios-engine-${{ matrix.sdk }}
          # The Xcode project must have been generated.
          if [ ! -e "$DIR/OpenXRay.xcodeproj/project.pbxproj" ]; then
            echo "::error::engine Xcode project was not generated"; exit 1
          fi
          # The iOS branch must have taken effect: static build, standard allocator.
          grep -q 'BUILD_SHARED_LIBS:BOOL=OFF' "$DIR/CMakeCache.txt" \
            || { echo "::error::BUILD_SHARED_LIBS is not OFF"; exit 1; }
          grep -q 'MEMORY_ALLOCATOR:STRING=standard' "$DIR/CMakeCache.txt" \
            || echo "::warning::MEMORY_ALLOCATOR is not 'standard'"
          echo "engine configured for iOS (static, deps resolved)"

      # Slice 3: compile the Externals static libraries. This is the first real iOS
      # compile of LuaJIT under the Xcode generator (its build-time host codegen tools
      # + VM generation), luabind, xrLuaFix, OPCODE, ODE, and ImGui (ES3 backend).
      - name: Build Externals static libs (${{ matrix.platform }})
        run: >
          cmake --build build/ios-engine-${{ matrix.sdk }} --config Release
          --target xrLuaJIT xrLuabind xrLuaFix xrOPCODE xrODE xrImGui
          -- -quiet

      - name: Verify Externals libs are arm64
        run: |
          set -e
          # Output names vary by each target's PREFIX property (libX.a vs X.a) and land
          # under the build tree or bin/; match a *<stem>.a glob from the repo root.
          for stem in xrLuaJIT xrLuabind xrLuaFix xrOPCODE xrODE xrImGui; do
            path=$(find . -name "*${stem}.a" 2>/dev/null | head -1)
            if [ -z "$path" ]; then echo "::error::${stem} static lib not found"; find . -name '*.a' 2>/dev/null; exit 1; fi
            info=$(lipo -info "$path"); echo "$info"
            echo "$info" | grep -qi 'arm64' || { echo "::error::${stem} is not arm64"; exit 1; }
          done
          echo "all Externals static libs present and arm64"

      # Slice 4a: compile the engine support libs (everything except the big three:
      # xrEngine, xrRender_GL, xrGame — those are Slice 4b). Build each target on its own,
      # continuing past failures, so one CI round surfaces every broken module. No link.
      - name: Build engine support libs (${{ matrix.platform }})
        run: |
          DIR=build/ios-engine-${{ matrix.sdk }}
          targets="xrMiscMath xrCore xrAICore xrCDB xrAPI xrUICore xrMaterialSystem xrParticles xrNetServer xrPhysics xrSound xrScriptEngine"
          failed=""
          for t in $targets; do
            echo "::group::build $t"
            if cmake --build "$DIR" --config Release --target "$t" -- -quiet; then
              echo "OK: $t"
            else
              echo "::error::build failed: $t"; failed="$failed $t"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error::failed engine libs:$failed"; exit 1; fi
          echo "all Slice 4a engine support libs compiled for iOS"

      # Slice 4b: compile the big three. xrRender_GL uses desktop GL via glad (compiles as
      # in-lib function pointers; runtime GLES port is Phase 4). xrGame is huge and the
      # likeliest to surface source-level GameSpy/multiplayer references now the lib is gated.
      # No final xr_3da link — that is Phase 2e.
      - name: Build engine core libs (${{ matrix.platform }})
        run: |
          DIR=build/ios-engine-${{ matrix.sdk }}
          failed=""
          for t in xrEngine xrRender_GL xrGameSpy xrGame; do
            echo "::group::build $t"
            if cmake --build "$DIR" --config Release --target "$t" -- -quiet; then
              echo "OK: $t"
            else
              echo "::error::build failed: $t"; failed="$failed $t"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error::failed engine libs:$failed"; exit 1; fi
          echo "whole engine compiles for iOS"

      # Phase 2e: link the whole engine into one iOS Mach-O (xr_3da). Exit criterion is
      # zero unresolved symbols. Renderer runtime (GLES/ANGLE) is Phase 4; SDL_main/UIKit
      # app lifecycle is Phase 3 — this step only proves the static link closes.
      - name: Link xr_3da (${{ matrix.platform }})
        run: |
          DIR=build/ios-engine-${{ matrix.sdk }}
          cmake --build "$DIR" --config Release --target xr_3da -- -quiet
          BIN=$(find "$DIR" bin -type f -name 'xr_3da' 2>/dev/null | head -1)
          if [ -z "$BIN" ]; then echo "::error::xr_3da binary not produced"; find "$DIR" -name 'xr_3da*' 2>/dev/null; exit 1; fi
          echo "linked: $BIN"; file "$BIN"; lipo -info "$BIN"
          lipo -info "$BIN" | grep -qi 'arm64' || { echo "::error::xr_3da is not arm64"; exit 1; }
          echo "xr_3da linked for iOS (arm64, zero unresolved symbols)"

      # Package the complete device app bundle as an unsigned .ipa
      # (Payload/<app>). SideStore/AltStore can re-sign it for optional remote
      # testing. A simulator .app is not installable on a device.
      - name: Package unsigned .ipa (device)
        if: ${{ matrix.sdk == 'iphoneos' }}
        run: |
          set -e
          DIR=build/ios-engine-${{ matrix.sdk }}
          APP=$(find "$DIR" bin -type d -name 'xr_3da.app' 2>/dev/null | head -1)
          if [ -z "$APP" ]; then echo "::error::xr_3da.app not found"; find "$DIR" bin -name '*.app' 2>/dev/null; exit 1; fi
          echo "app bundle: $APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry OpenXRay.ipa Payload
          echo "--- Info.plist ---"; plutil -p "$APP/Info.plist" 2>/dev/null | head -100 || true
          echo "--- .ipa ---"; ls -la OpenXRay.ipa; unzip -l OpenXRay.ipa | tail -5

      - name: Verify and package dSYM (device)
        if: ${{ matrix.sdk == 'iphoneos' }}
        run: |
          set -e
          DIR=build/ios-engine-${{ matrix.sdk }}
          APP=$(find "$DIR" bin -type d -name 'xr_3da.app' 2>/dev/null | head -1)
          DSYM=$(find "$DIR" bin -type d -name 'xr_3da.app.dSYM' 2>/dev/null | head -1)
          if [ -z "$APP" ] || [ -z "$DSYM" ]; then
            echo "::error::device app or dSYM not found"
            find "$DIR" bin -name 'xr_3da*' 2>/dev/null
            exit 1
          fi
          DEBUG_INFO_BYTES=$(dwarfdump --show-section-sizes "$DSYM" \
            | awk '$1 == "__debug_info" {print $2}')
          echo "dSYM __debug_info bytes: ${DEBUG_INFO_BYTES:-0}"
          # A final-target-only dSYM was observed at ~51 KB while the complete
          # engine target graph produces ~590 MB. Keep a conservative 100 MiB
          # floor so a technically non-empty but unusable symbols artifact fails.
          if [ -z "$DEBUG_INFO_BYTES" ] || [ "$DEBUG_INFO_BYTES" -lt 104857600 ]; then
            echo "::error::dSYM .debug_info is incomplete (expected at least 100 MiB)"
            exit 1
          fi
          BIN_UUID=$(dwarfdump --uuid "$APP/xr_3da" | awk '{print $2}' | sort)
          DSYM_UUID=$(dwarfdump --uuid "$DSYM" | awk '{print $2}' | sort)
          echo "binary UUID: $BIN_UUID"
          echo "dSYM UUID:   $DSYM_UUID"
          if [ -z "$BIN_UUID" ] || [ "$BIN_UUID" != "$DSYM_UUID" ]; then
            echo "::error::dSYM UUID does not match the packaged binary"
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$DSYM" OpenXRay.dSYM.zip

      - name: Upload .ipa artifact
        if: ${{ matrix.sdk == 'iphoneos' }}
        uses: actions/upload-artifact@v4
        with:
          name: OpenXRay-ios-ipa
          path: OpenXRay.ipa
          if-no-files-found: error

      - name: Upload dSYM artifact
        if: ${{ matrix.sdk == 'iphoneos' }}
        uses: actions/upload-artifact@v4
        with:
          name: OpenXRay-ios-dSYM
          path: OpenXRay.dSYM.zip
          if-no-files-found: error

  # Phase 3.10: publish the device .ipa to a rolling `ios-dev` pre-release and generate a
  # SideStore/AltStore source (apps.json). The user adds the apps.json URL to SideStore once;
  # every push updates the release so SideStore offers the new build as an update.
  release:
    name: Publish ios-dev release + SideStore source
    if: ${{ github.ref == 'refs/heads/ios-port' }}
    runs-on: ubuntu-latest
    needs: [ios, engine-build, shader-check, luajit]
    # Never cancel an in-flight two-asset update. Older runs finish first; the
    # newest queued run then replaces both IPA and apps.json as one publication.
    concurrency:
      group: ios-dev-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Download .ipa
        uses: actions/download-artifact@v4
        with:
          name: OpenXRay-ios-ipa

      - name: Generate SideStore source and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          SIZE=$(wc -c < OpenXRay.ipa)
          # Read the version straight from the built .ipa so the source's version ALWAYS
          # matches what SideStore reads from the bundle (else "expected X, found Y" on install).
          rm -rf _ipa && mkdir _ipa && (cd _ipa && unzip -qo ../OpenXRay.ipa)
          PLIST=$(find _ipa -name Info.plist -path '*.app/*' | head -1)
          VERSION=$(python3 -c "import plistlib; print(plistlib.load(open('$PLIST','rb'))['CFBundleShortVersionString'])")
          echo "ipa CFBundleShortVersionString: $VERSION"
          DATE=$(date -u +%Y-%m-%d)
          REPO="${{ github.repository }}"
          OWNER="${{ github.repository_owner }}"
          BASE="https://github.com/$REPO/releases/download/ios-dev"
          cat > apps.json <<JSON
          {
            "name": "OpenXRay iOS (dev)",
            "identifier": "io.github.tryk016.openxray.source",
            "sourceURL": "$BASE/apps.json",
            "apps": [
              {
                "name": "OpenXRay",
                "bundleIdentifier": "io.github.tryk016.openxray",
                "developerName": "OpenXRay iOS port ($OWNER)",
                "subtitle": "S.T.A.L.K.E.R. X-Ray engine on iOS (dev)",
                "localizedDescription": "Development build of the OpenXRay iOS port for Call of Pripyat 1.6.02. The native OpenGL ES 3.0 build is playable with user-supplied legal game data; lifecycle, memory and touch-gameplay work remains.",
                "iconURL": "https://raw.githubusercontent.com/$REPO/${{ github.ref_name }}/misc/ios/openxray_icon.png",
                "tintColor": "2e7d32",
                "category": "games",
                "screenshotURLs": [],
                "versions": [
                  {
                    "version": "$VERSION",
                    "date": "$DATE",
                    "localizedDescription": "Dev build $VERSION (commit ${{ github.sha }}). Playable controller test build; retail game data is not included. See doc/iOS-Port.md for current limitations.",
                    "downloadURL": "$BASE/OpenXRay.ipa",
                    "size": $SIZE,
                    "minOSVersion": "16.4"
                  }
                ]
              }
            ]
          }
          JSON
          echo "--- apps.json ---"; cat apps.json
          gh release view ios-dev --repo "$REPO" >/dev/null 2>&1 || \
            gh release create ios-dev --repo "$REPO" --prerelease \
              --title "OpenXRay iOS — dev builds" \
              --notes "Rolling development build of the OpenXRay iOS port. Unsigned; SideStore/AltStore re-sign on-device. **Add this SideStore source:** \`$BASE/apps.json\`"
          gh release upload ios-dev --repo "$REPO" OpenXRay.ipa apps.json --clobber
          echo "::notice::SideStore source URL — $BASE/apps.json"

  # Offline GLSL ES 3.00 validation for the GL shader tree. Run the exact same
  # shader-only gate as developers: compile permutations, value-macro contracts,
  # and all 137 VS->FS interface pairs. Runs on Linux, no device or deps needed.
  shader-check:
    name: GLSL ES 3.00 shader check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build pinned glslang 16.4.0
        run: |
          GLSLANG_SHA=168d452a4f460d24b588fed08477a81c44ee27a1
          git clone --depth 1 --branch 16.4.0 --recursive --shallow-submodules \
            https://github.com/KhronosGroup/glslang.git /tmp/glslang
          test "$(git -C /tmp/glslang rev-parse HEAD)" = "$GLSLANG_SHA" || {
            echo "::error::glslang 16.4.0 tag does not match pinned commit $GLSLANG_SHA"
            exit 1
          }
          cmake -S /tmp/glslang -B /tmp/glslang-build \
            -DCMAKE_BUILD_TYPE=Release -DENABLE_OPT=OFF -DGLSLANG_TESTS=OFF
          cmake --build /tmp/glslang-build --target glslang-standalone --parallel 2
          mkdir -p tools/glslang/bin
          cp /tmp/glslang-build/StandAlone/glslang tools/glslang/bin/glslangValidator
          tools/glslang/bin/glslangValidator --version

      - name: Validate GL shaders as GLSL ES 3.00
        run: ./misc/ios/build_check.sh --shaders

  # Phase 2: LuaJIT is built inside the engine's CMake (not the deps superbuild). This job
  # verifies the iOS cross-compile in isolation: native host codegen tools (minilua/buildvm)
  # generate the VM, and the target xrLuaJIT static lib is built for the iphoneos SDK.
  luajit:
    name: iOS LuaJIT ${{ matrix.name }}
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: device
            platform: OS64
          - name: simulator
            platform: SIMULATORARM64

    steps:
      - uses: actions/checkout@v4

      - name: Init LuaJIT submodule
        run: git submodule update --init Externals/LuaJIT

      - name: Show toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          cmake --version

      - name: Configure (${{ matrix.platform }})
        run: >
          cmake -S cmake/ios/luajit-check -B build/luajit-${{ matrix.platform }}
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/cmake/toolchains/ios.toolchain.cmake
          -DPLATFORM=${{ matrix.platform }}
          -DDEPLOYMENT_TARGET=16.4
          -DENABLE_BITCODE=OFF
          --log-level=VERBOSE

      - name: Build
        run: cmake --build build/luajit-${{ matrix.platform }} --parallel 4

      - name: Verify xrLuaJIT static lib is arm64
        run: |
          set -e
          LIB=$(find build/luajit-${{ matrix.platform }} \( -name 'xrLuaJIT.a' -o -name 'libxrLuaJIT.a' \) | head -1)
          if [ -z "$LIB" ]; then
            echo "::error::xrLuaJIT static lib not found"; find build/luajit-${{ matrix.platform }} -name '*.a'; exit 1
          fi
          echo "lib: $LIB"
          file "$LIB"
          lipo -info "$LIB"
          lipo -info "$LIB" | grep -qi 'arm64' || { echo "::error::xrLuaJIT is not arm64"; exit 1; }
          # The host codegen tools must have run and produced the VM assembly.
          VM=$(find build/luajit-${{ matrix.platform }} -name 'lj_vm.S' | head -1)
          echo "generated VM: ${VM:-<none>}"
